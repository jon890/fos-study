<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>김병태 백엔드·AI 지원 문서 미리보기</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root {
      --ink: #172033;
      --muted: #667085;
      --line: #d8dee9;
      --paper: #ffffff;
      --canvas: #eef2f7;
      --accent: #087f5b;
      --accent-soft: #e7f5ef;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: var(--ink);
      background: var(--canvas);
      font-family: Pretendard, -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", sans-serif;
      line-height: 1.7;
    }
    .toolbar {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 14px 24px;
      color: white;
      background: rgba(20, 30, 48, 0.96);
      box-shadow: 0 4px 18px rgba(15, 23, 42, 0.16);
      backdrop-filter: blur(10px);
    }
    .brand strong { display: block; font-size: 16px; }
    .brand span { color: #b9c4d4; font-size: 12px; }
    .tabs { display: flex; gap: 8px; }
    .tabs button {
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 999px;
      padding: 8px 14px;
      color: #d9e2ef;
      background: transparent;
      cursor: pointer;
      font-weight: 700;
    }
    .tabs button.active {
      color: #10291f;
      border-color: #8ce0bd;
      background: #8ce0bd;
    }
    .status {
      max-width: 920px;
      margin: 24px auto 0;
      padding: 10px 16px;
      border: 1px solid #b7dfcf;
      border-radius: 10px;
      color: #245d49;
      background: var(--accent-soft);
      font-size: 13px;
    }
    main {
      width: min(920px, calc(100% - 32px));
      margin: 18px auto 60px;
      padding: 60px 68px;
      border-radius: 14px;
      background: var(--paper);
      box-shadow: 0 18px 55px rgba(15, 23, 42, 0.12);
    }
    h1 {
      margin: 0 0 22px;
      padding-bottom: 18px;
      border-bottom: 3px solid var(--accent);
      font-size: 34px;
      line-height: 1.3;
      letter-spacing: -0.04em;
    }
    h2 {
      margin: 46px 0 16px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--line);
      color: #075f46;
      font-size: 23px;
      letter-spacing: -0.025em;
    }
    h3 { margin: 30px 0 10px; font-size: 18px; }
    h4 { margin: 22px 0 8px; color: #344054; font-size: 15px; }
    p { margin: 8px 0 14px; }
    ul, ol { margin: 8px 0 18px; padding-left: 24px; }
    li { margin: 5px 0; }
    strong { color: #102a43; }
    code {
      border-radius: 5px;
      padding: 2px 5px;
      color: #7c2d12;
      background: #fff2e8;
      font-family: "SFMono-Regular", Consolas, monospace;
      font-size: 0.9em;
    }
    a { color: #087f5b; text-decoration-thickness: 1px; text-underline-offset: 3px; }
    table {
      width: 100%;
      margin: 18px 0 28px;
      border-collapse: collapse;
      font-size: 14px;
    }
    th, td {
      padding: 11px 12px;
      border: 1px solid var(--line);
      text-align: left;
      vertical-align: top;
    }
    th { color: #344054; background: #f6f8fb; }
    blockquote {
      margin: 18px 0;
      padding: 10px 18px;
      border-left: 4px solid var(--accent);
      color: #475467;
      background: #f8fafc;
    }
    .error { color: #b42318; }
    @media (max-width: 720px) {
      .toolbar { align-items: flex-start; flex-direction: column; }
      main { padding: 34px 24px; }
      h1 { font-size: 28px; }
      table { display: block; overflow-x: auto; }
    }
    @media print {
      body { background: white; }
      .toolbar, .status { display: none; }
      main { width: 100%; margin: 0; padding: 0; box-shadow: none; }
    }
  </style>
</head>
<body>
  <header class="toolbar">
    <div class="brand">
      <strong>김병태 · 백엔드 and AI</strong>
      <span>경력기술서와 포트폴리오 초안 미리보기</span>
    </div>
    <nav class="tabs" aria-label="문서 선택">
      <button type="button" class="active" data-file="2607_김병태_경력기술서_backend-ai.md">경력기술서</button>
      <button type="button" data-file="2607_김병태_포트폴리오_backend-ai.md">포트폴리오</button>
    </nav>
  </header>
  <div class="status">현재 초안입니다. 검토가 끝나기 전에는 커밋하거나 공개 발행하지 않습니다.</div>
  <main id="content" aria-live="polite">문서를 불러오는 중입니다.</main>
  <script>
    const content = document.querySelector("#content");
    const buttons = [...document.querySelectorAll("[data-file]")];

    async function loadDocument(file, button) {
      for (const item of buttons) item.classList.toggle("active", item === button);
      content.textContent = "문서를 불러오는 중입니다.";
      try {
        const response = await fetch(file);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const markdown = await response.text();
        content.innerHTML = marked.parse(markdown, { gfm: true });
        window.scrollTo({ top: 0, behavior: "smooth" });
      } catch (error) {
        content.innerHTML = `<p class="error">미리보기를 불러오지 못했습니다: ${String(error)}</p>`;
      }
    }

    for (const button of buttons) {
      button.addEventListener("click", () => loadDocument(button.dataset.file, button));
    }
    loadDocument(buttons[0].dataset.file, buttons[0]);
  </script>
</body>
</html>
